services:
  db:
    image: postgres:16-alpine
    container_name: ith_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local S3-compatible storage for uploads (profile photos).
  # RustFS speaks the same S3 API as AWS S3, so the Django code is identical
  # locally and on AWS. (MinIO stopped publishing free Docker images in 2025.)
  storage:
    image: rustfs/rustfs:latest
    container_name: ith_storage
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - storage_data:/data

volumes:
  postgres_data:
  storage_data:
